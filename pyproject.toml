[project]
license = "Apache-2.0"
name = "frontend-test-runner-service"
version = "0.1.0"
description = "Playwright test execution microservice — runs BDD-generated tests against live sites"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[all]>=0.135.0",
    "uvicorn[standard]>=0.41.0",
    "psycopg[binary,pool]>=3.3.0",
    "sqlalchemy[asyncio]>=2.0.48",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.14.2",  # GHSA-4xgf-cpjx-pc3j fixed in 2.14.2
    "python-dotenv>=1.2.0",
    "redis>=7.3.0",
    "alembic>=1.18.0",
    "httpx>=0.28.0",
    # >=0.39.0 for the storage facade's streaming put_file + range-aware
    # get_object_stream (used to store/serve clips, reports and artifacts
    # without buffering them in memory — OOM on video).
    # >=0.51.0 for w2v_common.net.validate_public_url — the fleet-wide SSRF
    # guard used by _validate_url (resolves hostnames, denies RFC 6598 CGNAT
    # CGNAT (RFC 6598) = the private tailnet, fails closed on DNS failure).
    # >=0.75.0 for w2v_common.auth.LICENSE_GATE / is_license_exempt_path — the
    # shared entitlement gate. This service is a BILLED/metered destination
    # (w2v_common.auth.outbound.METERED_DESTINATION_SERVICES) but carried no
    # gate at all: AuthMiddleware answered "who are you", never "may you", so a
    # tenant whose licence was expired or revoked still executed billable BDD
    # runs. The gate is dormant unless W2V_LICENSE_GATE_ENABLED=true.
    "w2v-common>=0.75.0",
    # MinIO shared artifact storage so recorded clips + HTML reports survive
    # across replicas (the poll/download route can land on any pod). The
    # w2v_common storage facade imports miniopy-async lazily, so the consumer
    # declares it.
    "miniopy-async>=1.23.0",
    # --- Security floors on transitive dependencies ---
    # Neither of these is imported by this service directly; both arrive through
    # other pins — aiohttp via `miniopy-async` (and its own `aiohttp-retry`
    # dependency), cryptography via `w2v-common` and the `pyjwt[crypto]` extra
    # that w2v-common pulls in. The lock is already at safe versions; these
    # floors are what stop it drifting back. A lock is a point-in-time
    # resolution, so the next unrelated `uv lock` is free to walk an undeclared
    # transitive down again. The declared floor is the only thing that binds it.
    #
    # aiohttp 3.14.1 was flagged by CVE-2026-59881 + CVE-2026-69243 (fixed in
    # 3.14.2) and CVE-2026-69244 (fixed in 3.14.3); 3.14.3 was then flagged by
    # CVE-2026-111063 + CVE-2026-111064 + GHSA-2g87-pp6c-29x5 (fixed in 3.14.4).
    "aiohttp>=3.14.4",
    # cryptography: CVE-2026-69247 (GHSA-g6cj-pr64-35w5) was introduced in
    # 44.0.0 and fixed in 50.0.0, so the previously-locked 49.0.0 was affected.
    "cryptography>=50.0.0",
]

[project.scripts]
frontend-test-runner-service = "src.asgi:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "httpx>=0.28.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "fakeredis>=2.34.0",
    "pip-audit>=2.10.0",
    # Transitive via pip-audit -> pip-api -> pip. PYSEC-2026-3721 affects
    # pip < 26.2; declared explicitly so a future `uv lock` cannot walk the
    # lock back into the vulnerable range with pip-audit still green.
    "pip>=26.2",
    "detect-secrets>=1.5.0",
    "bandit>=1.8.0",
    "lupa>=2.8",
]

[tool.uv]
override-dependencies = [
    # miniopy-async (1.23.5, the LATEST) caps the CA-certificate bundle:
    #   certifi>=2025.1.31,<2026.0.0
    # That is lazy upper-bounding, not a real incompatibility -- certifi's entire
    # public API is where()/contents() and has been stable for years, while the
    # package's whole purpose is to ship CURRENT roots. Left alone the cap pins
    # every MinIO-using repo in this fleet to a trust store from Nov 2025, and no
    # relock cadence can move it (verified by making uv name the constraint).
    #
    # NOT overriding miniopy-async's argon2-cffi<24.0.0 alongside it: that is a
    # MAJOR bump with real API surface, so it needs its own testing rather than
    # riding along with a data-only package.
    "certifi>=2026.7.22",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "ANN", "B", "BLE", "A", "S", "C901",
    "RUF", "RET", "SIM", "ASYNC", "PTH", "TID251",
]
ignore = [
    "E501",
    "B008",
    "ASYNC240",
    "ASYNC109"
]

# uuid7 is the id standard (stdlib, py3.14). TID251 bans `uuid4` in production
# code via ruff — enforced in CI (`ruff check .`), not only local pre-commit.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"uuid.uuid4".msg = "uuid7 is the w2v id standard — use uuid.uuid7() (stdlib, py3.14)."

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104", "S105", "S106", "S107", "S108", "ANN", "PTH", "ASYNC230", "ASYNC240", "SIM117", "TID251"]

# ── ANN401 ratchet (see [tool.ruff.lint].ignore note) ─────────────────────────
# These files still carry `Any` in a function signature. Do NOT add to this list.
# When you type a file's seam with pydantic models, DELETE its line here — that
# re-enables ANN401 for the file and locks the win in. Target: empty.
"src/asgi.py" = ["ANN401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
filterwarnings = [
    "ignore:coroutine '.*AsyncMockMixin._execute_mock_call.*' was never awaited:RuntimeWarning",
]

[tool.coverage.report]
fail_under = 80

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
import-not-found = "error"
unresolved-reference = "error"
missing-attribute = "error"
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
missing-argument = "error"
invalid-argument-type = "error"
invalid-explicit-return = "error"

[tool.bandit]
targets = ["src"]
skips = ["B311"]
exclude_dirs = ["tests", ".venv"]

[tool.uv.sources]
# The published source tree resolves its shared library from the public
# repository at the release tag; the private index is not reachable here.
w2v-common = { git = "https://github.com/nonagenticai/w2v_common", tag = "v0.115.4" }
